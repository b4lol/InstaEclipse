plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = 'ps.reso.instaeclipse'
    compileSdk = 37

    defaultConfig {
        applicationId = "ps.reso.instaeclipse"
        minSdk = 28
        targetSdk = 36
        versionCode = 21
        versionName = '0.7.1'

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    testOptions {
        // android.util.Log is only stubbed on the JVM; let the hook layer's logging no-op.
        unitTests.returnDefaultValues = true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // AGP 9 built-in Kotlin; match its compiler/runtime, without a second Android plugin.
    implementation libs.kotlin.stdlib
    // Core Android dependencies
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.gson
    implementation libs.dexkit
    implementation libs.documentfile
    implementation libs.osmdroid

    // Testing dependencies
    testImplementation libs.junit
    testImplementation libs.libxposed.api
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // Modern Xposed API (libxposed, API 102). The framework provides it at runtime.
    compileOnly libs.libxposed.api
    // @SinceApi / @InternalApi markers used by the API, and the lint checks that flag API 102
    // calls made without a framework version check (the module still loads on API 101).
    compileOnly libs.libxposed.annotation
    lintChecks libs.libxposed.lint
    // Lets the companion app talk to the framework (remote preferences shared with the module).
    implementation libs.libxposed.service
}
