plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'ps.reso.instaeclipse'
    compileSdk 36

    defaultConfig {
        applicationId "ps.reso.instaeclipse"
        minSdk 28
        targetSdk 36
        versionCode 18
        versionName '0.7.0-test.2'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        // android.util.Log is only stubbed on the JVM; let the hook layer's logging no-op.
        unitTests.returnDefaultValues = true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    // Core Android dependencies
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.gson
    implementation libs.dexkit
    implementation libs.documentfile
    implementation libs.osmdroid

    // Testing dependencies
    testImplementation libs.junit
    testImplementation libs.libxposed.api
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // Modern Xposed API (libxposed, API 101). The framework provides it at runtime.
    compileOnly libs.libxposed.api
    // Lets the companion app talk to the framework (remote preferences shared with the module).
    implementation libs.libxposed.service
}
